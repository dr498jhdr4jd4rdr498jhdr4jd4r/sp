<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse | High-Quality Media Extractor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --card-bg: rgba(18, 20, 32, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        .container { width: 100%; max-width: 720px; }

        .header-title {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header-title h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
        .header-title p { color: var(--text-muted); font-size: 0.95rem; }

        .search-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 0 1.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        button:disabled { background: #374151; color: var(--text-muted); cursor: not-allowed; transform: none; }

        .result-card {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .media-info { display: flex; flex-direction: column; }
        @media (min-width: 640px) { .media-info { flex-direction: row; } }

        .thumbnail-container { 
            position: relative; 
            width: 100%; 
            max-width: 280px; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        
        .thumbnail { 
            width: 100%; 
            height: 100%; 
            max-height: 200px;
            object-fit: contain; 
            display: block; 
        }
        
        .duration-badge {
            position: absolute;
            bottom: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .details { padding: 1.75rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .title { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-bottom: 1.5rem; color: var(--text-main); }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
        }
        
        .error-message { 
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171; 
            padding: 1rem;
            border-radius: 12px;
            text-align: center; 
            margin-top: 1rem; 
            display: none; 
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">
            <h1>Media Extractor</h1>
            <p>Convert YouTube & Spotify links to high-quality MP3 tracks instantly</p>
        </div>

        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Paste link here (e.g., https://...)" autocomplete="off">
            <button id="extractBtn" onclick="extractMedia()">Search</button>
        </div>
        
        <div id="errorMsg" class="error-message"></div>

        <div class="result-card" id="resultCard">
            <div class="media-info">
                <div class="thumbnail-container">
                    <img src="" alt="Thumbnail" class="thumbnail" id="thumbImg">
                    <div class="duration-badge" id="durationBadge">00:00</div>
                </div>
                <div class="details">
                    <h2 class="title" id="mediaTitle">Loading...</h2>
                    <a href="#" class="download-btn" id="downloadBtn" onclick="triggerDownload(event)">⬇ Download MP3 (192kbps)</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function extractMedia() {
            const urlInput = document.getElementById('urlInput');
            const extractBtn = document.getElementById('extractBtn');
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');
            
            const url = urlInput.value.trim();
            if (!url) return;

            extractBtn.disabled = true;
            extractBtn.textContent = 'Searching...';
            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to fetch media details');

                document.getElementById('thumbImg').src = data.thumbnail;
                document.getElementById('durationBadge').textContent = data.duration;
                document.getElementById('mediaTitle').textContent = data.title;
                
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.dataset.url = data.original_url;

                resultCard.style.display = 'block';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                extractBtn.disabled = false;
                extractBtn.textContent = 'Search';
            }
        }

        function triggerDownload(e) {
            e.preventDefault();
            const btn = e.currentTarget;
            const originalUrl = btn.dataset.url;
            if (!originalUrl) return;

            const originalText = btn.textContent;
            btn.textContent = 'Transcoding & Downloading...';
            btn.style.pointerEvents = 'none';

            window.location.href = `/api/download?url=${encodeURIComponent(originalUrl)}`;

            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.pointerEvents = 'auto';
            }, 4000);
        }
        
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') extractMedia();
        });
    </script>
</body>
</html>
